name: Auto-check UI Libraries

on:
  schedule:
    - cron: '0 17 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run build-readme
        run: node scripts/build-readme.js

      - name: Auto-commit updates
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "nnhann99@gmail.com"
          git add README.md data/ui-libs.json
          git diff --staged --quiet || (git commit -m "chore: auto update ui libraries status & readme" && git push)
