name: Auto-check UI Libraries

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - main

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run build-readme
        run: node scripts/build-readme.js

      - name: Auto-commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/ui-libs.json
          git commit -m "chore: update ui libraries status" || echo "No changes to commit"
          git push
